name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - name: Cache apt packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives
        key: apt-qt6-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          qt6-base-dev \
          libqt6sql6 \
          libqt6sql6-sqlite \
          libarchive-dev

    - name: Cache CMake build directory
      uses: actions/cache@v5
      with:
        path: build
        key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'resources.qrc', '*.jpg', '*.png') }}
        restore-keys: cmake-${{ runner.os }}-

    - name: Configure build
      run: |
        mkdir -p build && cd build && cmake \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
          ..

    - name: Build project
      run: cd build && make -j$(nproc)

    - name: Run sanity tests
      run: cd build && ctest -L sanity -j$(nproc) --output-on-failure

    - name: Run remaining tests
      run: cd build && ctest -LE sanity -j$(nproc) --output-on-failure

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: bookhub-${{ github.sha }}
        path: build/bookhub
        retention-days: 7
