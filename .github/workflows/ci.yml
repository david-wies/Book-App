name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

concurrency:
  # Include event_name so a push and a pull_request on the same ref do not
  # cancel each other — they are distinct pipeline types.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v6

    - name: Cache apt packages
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives
        key: apt-qt6-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ccache \
          qt6-base-dev \
          libqt6sql6 \
          libqt6sql6-sqlite \
          libarchive-dev

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: ccache-${{ runner.os }}-

    - name: Configure ccache
      run: |
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache --set-config=sloppiness=pch_defines,time_macros
        ccache --zero-stats

    - name: Cache CMake build directory
      uses: actions/cache@v5
      with:
        path: build
        key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'resources.qrc', '*.jpg', '*.png') }}
        restore-keys: cmake-${{ runner.os }}-

    - name: Configure build
      # Debug keeps assertions active and gives ASan/UBSan cleaner stack traces.
      # ccache keeps incremental builds fast despite the extra debug metadata.
      run: |
        mkdir -p build && cd build && cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
          ..

    - name: Build project
      run: cd build && make -j$(nproc)

    - name: Print ccache stats
      run: ccache --show-stats

    - name: Run sanity tests
      run: cd build && ctest -L sanity -j$(nproc) --output-on-failure

    - name: Run remaining tests
      # Full suite only on master — develop gets sanity-only for fast feedback.
      # Build the EXCLUDE_FROM_ALL test executables explicitly before running them.
      if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
      run: |
        cd build
        make -j$(nproc) test_library_screen test_search_service test_search_screen test_explore_service test_explore_screen
        ctest -LE sanity -j$(nproc) --output-on-failure

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: bookhub-${{ github.sha }}
        path: build/bookhub
        retention-days: 7
