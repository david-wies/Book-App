name: Release

# Triggered when a version tag (e.g. v1.0.0) is pushed.
# Normal workflow:
#   1. tools/prepare-release.sh v1.0.0  →  opens a clean PR to master
#   2. Merge the PR on GitHub
#   3. git fetch origin && git tag -a v1.0.0 origin/master -m "Release v1.0.0"
#   4. git push origin v1.0.0           →  this workflow fires
#
# The workflow builds the binary on each supported platform, packages it,
# and publishes a single GitHub Release with all archives attached.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # Required to create GitHub Releases and upload assets.

jobs:
  # ── Per-platform build ───────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # Publish what built even if one platform fails.
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-14
            platform: macos-arm64

    steps:
    - name: Checkout tag
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Verify tag is on master
      shell: bash
      run: |
        git fetch origin master
        if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master; then
          echo "Error: tag ${{ github.ref_name }} is not reachable from master. Aborting release."
          exit 1
        fi

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.*'
        cache: true

    - name: Install build tools and libarchive (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          libarchive-dev

    - name: Install libarchive (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install libarchive:x64-windows

    - name: Install libarchive (macOS)
      if: runner.os == 'macOS'
      run: brew install libarchive

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra"

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -S . -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Configure (macOS)
      if: runner.os == 'macOS'
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra" \
          -DCMAKE_PREFIX_PATH="$(brew --prefix libarchive)"

    - name: Build
      run: cmake --build build --parallel

    - name: Run test suite
      # --no-tests=ignore: return 0 when no tests are registered yet (ctest
      # exit 8 would otherwise block every release until tests are wired up).
      run: ctest --test-dir build --output-on-failure --no-tests=ignore

    - name: Package (Linux)
      if: runner.os == 'Linux'
      run: |
        VERSION="${{ github.ref_name }}"
        NAME="bookhub-${VERSION}-linux-x86_64"
        mkdir -p "dist/${NAME}"
        cp build/bookhub "dist/${NAME}/"
        cp LICENSE "dist/${NAME}/"
        cd dist
        tar -czf "${NAME}.tar.gz" "${NAME}/"
        sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        VERSION="${{ github.ref_name }}"
        NAME="bookhub-${VERSION}-windows-x86_64"
        mkdir -p "dist/${NAME}"
        cp build/bookhub.exe "dist/${NAME}/"
        cp LICENSE "dist/${NAME}/"
        # Bundle Qt DLLs and SQL/platform plugins so users need no separate install.
        windeployqt --release "dist/${NAME}/bookhub.exe"
        cd dist
        7z a "${NAME}.zip" "${NAME}/"
        sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

    - name: Package (macOS)
      if: runner.os == 'macOS'
      run: |
        VERSION="${{ github.ref_name }}"
        NAME="bookhub-${VERSION}-macos-arm64"
        mkdir -p "dist/${NAME}"
        cp build/bookhub "dist/${NAME}/"
        cp LICENSE "dist/${NAME}/"
        cd dist
        tar -czf "${NAME}.tar.gz" "${NAME}/"
        # macOS ships shasum, not sha256sum.
        shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}
        path: dist/
        retention-days: 90

  # ── Publish GitHub Release ───────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download all platform artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Create GitHub Release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          const version = context.ref.replace('refs/tags/', '');

          const checksumFiles = fs.readdirSync('dist/').filter(f => f.endsWith('.sha256'));
          const checksums = checksumFiles
            .sort()
            .map(f => fs.readFileSync(`dist/${f}`, 'utf8').trim())
            .join('\n');

          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: version,
            name: `BookHub ${version}`,
            body: [
              `## BookHub ${version}`,
              '',
              '### Downloads',
              '',
              '| Platform | File |',
              '|----------|------|',
              `| Linux x86_64   | \`bookhub-${version}-linux-x86_64.tar.gz\`  |`,
              `| Windows x86_64 | \`bookhub-${version}-windows-x86_64.zip\`    |`,
              `| macOS arm64    | \`bookhub-${version}-macos-arm64.tar.gz\`    |`,
              '',
              '### Installation',
              '',
              '**Linux**',
              '1. Install runtime dependencies via your distro\'s package manager:',
              '   - Qt6 Widgets, Sql, and Network runtime libraries',
              '   - libarchive (e.g. `libarchive13` on Debian/Ubuntu · `libarchive` on Fedora/Arch)',
              `2. \`tar -xzf bookhub-${version}-linux-x86_64.tar.gz\``,
              `3. \`./bookhub-${version}-linux-x86_64/bookhub\``,
              '',
              '**Windows**',
              '1. No additional dependencies — Qt runtime DLLs are bundled.',
              `2. Extract the zip and run \`bookhub.exe\`.`,
              '',
              '**macOS (Apple Silicon)**',
              '1. Install runtime dependencies: `brew install libarchive` and Qt6 (`brew install qt`)',
              `2. \`tar -xzf bookhub-${version}-macos-arm64.tar.gz\``,
              `3. \`./bookhub-${version}-macos-arm64/bookhub\``,
              '',
              '### Checksums (SHA-256)',
              '',
              '```',
              checksums,
              '```',
            ].join('\n'),
            draft: false,
            prerelease: version.includes('-'),
          });

          // Upload every archive and checksum file.
          const files = fs.readdirSync('dist/').filter(f => fs.statSync(`dist/${f}`).isFile());
          for (const file of files) {
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: file,
              data: fs.readFileSync(`dist/${file}`),
            });
          }

          core.info(`Release published: ${release.data.html_url}`);
